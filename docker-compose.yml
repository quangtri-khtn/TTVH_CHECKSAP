services:
  db:
    image: postgres:16-alpine
    container_name: checkpilot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: checkpilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pilot123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d checkpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checkpilot_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pilot:${POSTGRES_PASSWORD:-pilot123}@db:5432/checkpilot
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://frontend"]'
    volumes:
      - ./backend/queries:/app/queries:ro
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: checkpilot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
