name: ttvh-sap-monitor
# ==============================================================================
# DEPLOYMENT / COMPANY DB COMPOSE — builds `api` and `web`.
# Connects directly to company PostgreSQL TTVH_DB (172.16.2.37:5433/ttvh_sap_monitor)
# and SAP SQL Server Linked Server (172.16.4.10:1433) via .env.
#
# Usage:
#   docker compose up -d --build
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ttvh-sap-monitor-api:latest
    container_name: ttvh-sap-monitor-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LOG_PRETTY: "false"
      PORT: 3001
      ALLOW_INSECURE_HTTP: "true"
    ports:
      - "${HOST_API_PORT:-3001}:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    logging: *default-logging
    networks:
      - ttvh_sap_monitor_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    image: ttvh-sap-monitor-web:latest
    container_name: ttvh-sap-monitor-web
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
    ports:
      - "${HOST_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    logging: *default-logging
    networks:
      - ttvh_sap_monitor_net

networks:
  ttvh_sap_monitor_net:
    name: ttvh_sap_monitor_net
    driver: bridge
